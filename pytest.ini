[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=0
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.testclient.StarletteDeprecationWarning
markers =
    integration: Tests requiring complete model weights or live file assets
    asyncio: Mark test as an asyncio coroutine
    anyio: Mark test to run with anyio
