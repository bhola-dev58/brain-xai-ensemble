name: Continuous Integration & Automated Quality Checks

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Quality & Automated Test Suite
    runs-on: ubuntu-latest

    env:
      TF_CPP_MIN_LOG_LEVEL: "3"
      TF_ENABLE_ONEDNN_OPTS: "0"
      CUDA_VISIBLE_DEVICES: "-1"
      ENABLE_API_DOCS: "false"
      LOG_LEVEL: "INFO"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run code quality checks (Critical Syntax & Undefined Symbols)
        run: |
          # Fails immediately if any syntax errors or undefined names are discovered
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run code quality inspection (Style & Complexity Warnings)
        run: |
          # Reports style, line-length, and complexity statistics without failing build
          flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run pytest automated test suite
        run: |
          pytest tests/ -v
