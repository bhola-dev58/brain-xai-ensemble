name: Continuous Integration & Automated Quality Checks

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Lint + Test + Coverage
  # ─────────────────────────────────────────────────────────────────
  quality-and-tests:
    name: Lint, Quality & Automated Test Suite
    runs-on: ubuntu-latest

    env:
      TF_CPP_MIN_LOG_LEVEL: "3"
      TF_ENABLE_ONEDNN_OPTS: "0"
      CUDA_VISIBLE_DEVICES: "-1"
      ENABLE_API_DOCS: "false"
      LOG_LEVEL: "INFO"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies (including dev + httpx2 to suppress deprecation warnings)
        run: |
          pip install -r requirements-dev.txt

      - name: Run code quality checks (Critical Syntax & Undefined Symbols)
        run: |
          # Fails immediately if any syntax errors or undefined names are discovered
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run code quality inspection (Style & Complexity Warnings)
        run: |
          # Reports style, line-length, and complexity statistics without failing build
          flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run pytest automated test suite with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --ignore=tests/test_inference.py \
            --ignore=tests/test_full_stack.py

      - name: Upload coverage report as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-report
          path: coverage.xml
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Dependency Security Audit (pip-audit)
  # ─────────────────────────────────────────────────────────────────
  security-audit:
    name: Dependency Security Audit (pip-audit)
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit security scan on runtime dependencies
        run: |
          pip-audit -r requirements.txt --desc --progress-spinner off || true
        # `|| true` prevents blocking the build on known unfixed upstream CVEs
        # while still surfacing them in the CI log for visibility.

      - name: Run pip-audit security scan on dev dependencies
        run: |
          pip install -r requirements-dev.txt
          pip-audit -r requirements-dev.txt --desc --progress-spinner off || true
