# ============================================================
#  BrainTumorXAI — Production Docker Compose Configuration
#  PACS Clinical Workstation + Tri-Ensemble REST API
# ============================================================

services:
  brain-tumor-xai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain-tumor-xai
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CUDA_VISIBLE_DEVICES=-1
      - TF_CPP_MIN_LOG_LEVEL=3
      - PYTHONUNBUFFERED=1
      - BRAIN_XAI_API_KEY=${BRAIN_XAI_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-true}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-25}
    volumes:
      # Persistent storage mounts
      - ./models:/app/models:ro  # Read-only mount for trained neural network artifacts
      - ./data:/app/data         # Persistent SQLite patient case history database
      - ./reports:/app/reports   # Persistent clinical PDF diagnostic reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').getcode() == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
